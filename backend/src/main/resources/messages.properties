# English (the default). Keys: error.<CODE> for API errors, notify.<code> for notifications, sms.* for SMS texts.
# Messages with {0}, {1} placeholders are run through MessageFormat: do not use a single quote in them.

# ---- SMS
sms.code.verify=Avshesh: your verification code is {0}. It is valid for 10 minutes. Do not share it with anyone.
sms.code.reset=Avshesh: your password reset code is {0}. It is valid for 10 minutes. Do not share it with anyone.

# ---- notifications
notify.pickup.confirmed=Pickup confirmed for {0}, {1}. {2} will visit you.
notify.payment.received=Collected {0} kg at Rs {1} per kg. Amount paid: Rs {2}. Please confirm in the app that you received it.
notify.payment.disputed={0} says the payment of Rs {1} was not received. Reason: {2}
notify.payment.dispute.resolved=The municipal office closed the payment dispute: {0}
notify.municipal.scheduled=Your municipal waste pickup is scheduled for {0}.
notify.municipal.scheduled.staff=Your municipal waste pickup is scheduled for {0}. {1} will collect it.
notify.municipal.collected=Your waste has been collected by the municipal corporation.
notify.municipal.rejected=Your municipal pickup request could not be accepted.
notify.municipal.reopened=Your municipal pickup request is open again.

