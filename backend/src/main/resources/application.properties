spring.application.name=avshesh
server.port=8080

# Database: local Docker Postgres by default, RDS on AWS via env vars
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/avshesh}
spring.datasource.username=${DB_USER:avshesh}
spring.datasource.password=${DB_PASSWORD:avshesh}
# Flyway owns the schema; Hibernate validate would reject NUMERIC columns mapped to double
spring.jpa.hibernate.ddl-auto=none
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
avshesh.photos.dir=${PHOTOS_DIR:uploads}
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Profile: local (mock AI, local photos, log notifications) or aws
spring.profiles.default=local
# Real municipal ward boundaries (Data{Meet}, CC BY-SA 2.5 India). Change both to use another city.
avshesh.wards.file=${WARDS_FILE:classpath:data/bhubaneswar-wards.tsv}
avshesh.wards.city=${WARDS_CITY:Bhubaneswar}

# "mock": the user names the item (no AWS needed). "bedrock": the photo is analysed by Amazon Bedrock.
avshesh.scanner=${SCANNER:mock}
avshesh.aws.region=${AWS_REGION:us-east-1}
avshesh.bedrock.model-id=${BEDROCK_MODEL_ID:amazon.nova-lite-v1:0}
avshesh.s3.bucket=${S3_BUCKET:avshesh-photos}
avshesh.sns.enabled=${SNS_ENABLED:false}

# JWT: set JWT_SECRET (32+ chars). If it is empty a random secret is generated at startup.
avshesh.jwt.secret=${JWT_SECRET:}
avshesh.jwt.ttl-hours=${JWT_TTL_HOURS:12}
avshesh.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}


# Behind nginx the client address is in X-Forwarded-For (nginx sets it; clients cannot).
server.forward-headers-strategy=framework
avshesh.scan.limit-per-hour=${SCAN_LIMIT_PER_HOUR:30}

# Homes within this distance of a pool's centre join it (kilometres).
avshesh.pool.join-radius-km=${POOL_JOIN_RADIUS_KM:0.4}
avshesh.register.limit-per-hour=${REGISTER_LIMIT_PER_HOUR:60}

# Rate limits: "memory" (this instance only) or "redis" (shared by all instances).
avshesh.limiter=${LIMITER:memory}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
management.health.redis.enabled=${REDIS_HEALTH:false}

# SMS: "log" writes the message to the log, "sns" sends it through Amazon SNS (needs AWS credentials or a role).
avshesh.sms.sender=${SMS_SENDER:log}
avshesh.sms.country-code=${SMS_COUNTRY_CODE:+91}
# Events that are also sent by SMS (everything is always put in the in-app inbox).
avshesh.sms.events=${SMS_EVENTS:pickup.confirmed,municipal.scheduled}
# Returns the verification code in the API response. For local development only, never in production.
# When false (the default) a new account is trusted at once; when true it must enter an SMS code before it can list,
# scan, accept or rate. Turn it on once a real SMS service is connected.
avshesh.sms.client-limit-per-hour=${SMS_CLIENT_LIMIT_PER_HOUR:20}
avshesh.phone-verification.required=${PHONE_VERIFICATION_REQUIRED:false}
avshesh.sms.dev-codes=${SMS_DEV_CODES:false}

# Message bundles: error texts and notification texts in English, Hindi and Odia.
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# Actuator (health, metrics, Prometheus) runs on an internal port that docker does not publish.
# The public port only has /api/v1/health for load balancers.
management.server.port=${MANAGEMENT_PORT:8081}
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
avshesh.photos.temp-ttl-hours=${PHOTO_TEMP_TTL_HOURS:24}

# The login cookie is only sent over HTTPS when this is true. Turn it on wherever the site is served over HTTPS.
avshesh.cookie.secure=${COOKIE_SECURE:false}

# Address search for choosing a home location. "nominatim" calls OpenStreetMap through this backend (cached,
# one call per second); "static" is a fixed offline list used by the automated tests.
avshesh.geo.provider=${GEO_PROVIDER:nominatim}
avshesh.geo.nominatim-url=https://nominatim.openstreetmap.org/search
# left,top,right,bottom of the area the app serves (Bhubaneswar)
avshesh.geo.viewbox=${GEO_VIEWBOX:85.70,20.40,85.92,20.18}
avshesh.geo.user-agent=Avshesh/1.0 (waste pooling prototype)

# Assumed waste per person per day, the yardstick for "share kept out of the dump". Replace with the corporation's own figure.
avshesh.impact.kg-per-person-per-day=${IMPACT_KG_PER_PERSON_PER_DAY:0.45}

# A lived-in demo city (more wards, officers, workers, dealers, households and pools in every state). Local profile only.
avshesh.demo.rich=${DEMO_RICH:true}
